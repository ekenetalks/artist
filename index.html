<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Social Sharing Tags -->
  <title>Ekene Talks | Official Music Portfolio</title>
  <meta name="description" content="Explore the official music catalog, lyrics, and streaming links on Spotify, Audiomack, and Apple Music for Ekene Talks.">
  <meta name="keywords" content="Ekene Talks, Music, Songs, Lyrics, Spotify, Audiomack, Apple Music, New Music">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ekene Talks | Official Music Portfolio">
  <meta property="og:description" content="Listen to the latest releases and view song lyrics.">
  <meta property="og:image" content="assets/dancepro.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ekene Talks | Music Catalog">
  <meta name="twitter:description" content="Listen to tracks and explore lyrics.">
  <meta name="twitter:image" content="assets/dancepro.jpg">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header & Bio -->
  <header class="artist-header">
    <div class="header-container">
      <h1>Ekene Talks</h1>
      <p class="bio">Independent Artist & Creator. Discography, latest releases, and lyrics.</p>
      
      <!-- Social Media Links -->
      <div class="social-links">
        <a href="https://instagram.com/ekenetalks" target="_blank" rel="noopener">Instagram</a>
        <a href="https://twitter.com/ekenetalks" target="_blank" rel="noopener">X / Twitter</a>
        <a href="https://youtube.com/@ekenetalks" target="_blank" rel="noopener">YouTube</a>
        <a href="https://tiktok.com/@ekenetalks" target="_blank" rel="noopener">TikTok</a>
      </div>
    </div>
  </header>

  <!-- Music Catalog Grid -->
  <main class="catalog-container">
    <h2>Music Catalog</h2>
    <div id="songs-grid" class="songs-grid">
      <!-- Songs dynamically injected via JS -->
    </div>
  </main>

  <!-- Lyrics Modal Window -->
  <div id="lyrics-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="close-modal" id="close-modal">&times;</button>
      <h3 id="modal-song-title">Song Title</h3>
      <pre id="modal-lyrics-text"></pre>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Ekene Talks. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
